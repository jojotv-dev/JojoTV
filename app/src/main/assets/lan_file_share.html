<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JojoTV · Fichiers</title>
  <style>
    :root { color-scheme: dark; font: 16px system-ui, sans-serif; background: #10131a; color: #f3f5f9; }
    body { margin: 0; }
    header { padding: 22px clamp(16px, 5vw, 56px); background: #1a202b; border-bottom: 1px solid #303846; }
    h1 { margin: 0; font-size: 1.3rem; }
    header p { margin: 5px 0 0; color: #aab4c4; font-size: .9rem; }
    main { max-width: 1100px; margin: auto; padding: 20px clamp(12px, 4vw, 40px); }
    nav { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 8px; }
    button, .download { border: 1px solid #465267; border-radius: 8px; background: #222b39; color: #fff; padding: 9px 12px; font: inherit; cursor: pointer; text-decoration: none; }
    button:hover, .download:hover { background: #2f3b4d; }
    :focus-visible { outline: 3px solid #83b6ff; outline-offset: 3px; }
    #location { color: #aab4c4; overflow-wrap: anywhere; }
    #message { min-height: 1.4em; color: #f0bd71; padding: 8px 0; }
    #hint { margin: 0 0 12px; color: #aab4c4; font-size: .85rem; }
    .entry { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; min-height: 54px; border-bottom: 1px solid #29313e; padding: 6px 0; }
    .name { flex: 1 1 260px; min-width: 0; overflow-wrap: anywhere; }
    .folder { border: 0; background: transparent; padding-left: 0; text-align: left; }
    .size { color: #aab4c4; font-size: .85rem; white-space: nowrap; }
    .action { padding: 7px 10px; font-size: .9rem; }
    .empty { padding: 28px 4px; color: #aab4c4; }
    @media (max-width: 600px) { .size { display: none; } .entry { gap: 7px; } .name { flex-basis: 100%; } }
  </style>
</head>
<body>
  <header>
    <h1>Fichiers de l’appareil</h1>
    <p>Parcourir, télécharger, renommer et supprimer les fichiers des stockages partagés.</p>
  </header>
  <main>
    <nav aria-label="Navigation des fichiers">
      <button id="back" type="button" hidden>Retour au dossier parent</button>
      <button id="roots" type="button">Stockages</button>
      <span id="location" aria-live="polite"></span>
    </nav>
    <p id="hint">Télécommande ou clavier : ↑/↓ pour déplacer le focus, ←/→ entre les actions, Entrée pour ouvrir ou activer, Retour pour revenir à la page précédente.</p>
    <div id="message" role="status" aria-live="polite"></div>
    <section id="files" aria-live="polite"></section>
  </main>
  <script>
    const files = document.getElementById('files');
    const message = document.getElementById('message');
    const locationLabel = document.getElementById('location');
    const backButton = document.getElementById('back');
    const actionSelector = 'button:not([hidden]):not([disabled]), a[href], input:not([disabled])';
    let currentPath = '';
    let rootPaths = [];

    function formatSize(bytes) {
      if (!bytes) return '';
      const units = ['o', 'Ko', 'Mo', 'Go', 'To'];
      let size = bytes;
      let index = 0;
      while (size >= 1024 && index < units.length - 1) { size /= 1024; index++; }
      return (index === 0 ? size : size.toFixed(1)) + ' ' + units[index];
    }

    function urlForPath(path) {
      const url = new URL(window.location.href);
      url.search = '';
      if (path) url.searchParams.set('path', path);
      return url.pathname + url.search + url.hash;
    }

    function parentPath(path) {
      const root = rootPaths.find(candidate => path === candidate || path.startsWith(candidate + '/'));
      if (!root || path === root) return '';
      const parent = path.substring(0, path.lastIndexOf('/'));
      return parent.length < root.length ? root : parent;
    }

    function addAction(row, label, className, ariaLabel, action) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'action ' + className;
      button.textContent = label;
      button.setAttribute('aria-label', ariaLabel);
      button.addEventListener('click', action);
      row.appendChild(button);
      return button;
    }

    async function requestMutation(endpoint, values) {
      const response = await fetch(endpoint, {
        method: 'POST',
        credentials: 'same-origin',
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8',
          'X-JojoTV-Request': 'file-action'
        },
        body: new URLSearchParams(values)
      });
      if (!response.ok) throw new Error(await response.text() || 'L’opération a échoué.');
      return response.json();
    }

    async function runMutation(endpoint, values, confirmation) {
      if (confirmation && !window.confirm(confirmation)) return;
      message.textContent = 'Mise à jour…';
      try {
        await requestMutation(endpoint, values);
        await showFolder(currentPath, false);
      } catch (error) {
        message.textContent = error.message || 'L’opération a échoué.';
      }
    }

    function addEntryActions(row, entry) {
      addAction(row, 'Renommer', 'rename', 'Renommer ' + entry.name, async () => {
        const newName = window.prompt('Nouveau nom', entry.name);
        if (newName === null || newName === entry.name) return;
        await runMutation('/api/rename', { path: entry.path, name: newName });
      });
      addAction(row, 'Supprimer', 'delete', 'Supprimer ' + entry.name, async () => {
        const detail = entry.directory ? ' et tout son contenu' : '';
        await runMutation(
          '/api/delete',
          { path: entry.path },
          'Supprimer « ' + entry.name + ' »' + detail + ' ? Cette action est irréversible.'
        );
      });
    }

    async function showFolder(path, pushHistory) {
      if (pushHistory) window.history.pushState({ path }, '', urlForPath(path));
      currentPath = path || '';
      backButton.hidden = !currentPath;
      files.replaceChildren();
      message.textContent = 'Lecture du dossier…';
      try {
        const query = currentPath ? '?path=' + encodeURIComponent(currentPath) : '';
        const response = await fetch('/api/list' + query, { cache: 'no-store', credentials: 'same-origin' });
        if (!response.ok) throw new Error('Le dossier ne peut pas être lu (' + response.status + ').');
        const entries = await response.json();
        if (!currentPath) rootPaths = entries.filter(entry => entry.directory).map(entry => entry.path);
        locationLabel.textContent = currentPath || 'Stockages disponibles';
        message.textContent = '';
        if (entries.length === 0) {
          files.innerHTML = '<div class="empty">Aucun fichier dans ce dossier.</div>';
          backButton.focus();
          return;
        }
        for (const entry of entries) {
          const row = document.createElement('div');
          row.className = 'entry';
          const name = document.createElement('div');
          name.className = 'name';
          if (entry.directory) {
            const open = document.createElement('button');
            open.className = 'folder';
            open.type = 'button';
            open.textContent = '📁  ' + entry.name;
            open.setAttribute('aria-label', 'Ouvrir le dossier ' + entry.name);
            open.addEventListener('click', () => showFolder(entry.path, true));
            name.appendChild(open);
          } else {
            name.textContent = '📄  ' + entry.name;
          }
          row.appendChild(name);
          if (!entry.directory) {
            const size = document.createElement('span');
            size.className = 'size';
            size.textContent = formatSize(entry.size);
            row.appendChild(size);
            const download = document.createElement('a');
            download.className = 'download action';
            download.href = '/download?path=' + encodeURIComponent(entry.path);
            download.download = entry.name;
            download.textContent = 'Télécharger';
            download.setAttribute('aria-label', 'Télécharger ' + entry.name);
            row.appendChild(download);
          }
          if (currentPath) addEntryActions(row, entry);
          files.appendChild(row);
        }
        const firstAction = files.querySelector(actionSelector);
        if (firstAction) firstAction.focus({ preventScroll: true });
      } catch (error) {
        message.textContent = error.message || 'Erreur de lecture.';
      }
    }

    document.getElementById('roots').addEventListener('click', () => showFolder('', true));
    backButton.addEventListener('click', () => showFolder(parentPath(currentPath), true));
    window.addEventListener('popstate', event => {
      const path = event.state?.path ?? new URLSearchParams(window.location.search).get('path') ?? '';
      showFolder(path, false);
    });

    document.addEventListener('keydown', event => {
      const target = event.target;
      if (target instanceof HTMLInputElement || target instanceof HTMLTextAreaElement || target.isContentEditable) return;
      if ((event.altKey && event.key === 'ArrowLeft') ||
          ['Escape', 'Backspace', 'BrowserBack'].includes(event.key)) {
        window.history.back();
        event.preventDefault();
        return;
      }
      if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
        const actions = [...document.querySelectorAll(actionSelector)].filter(element => !element.hidden);
        const currentIndex = actions.indexOf(document.activeElement);
        const nextIndex = event.key === 'ArrowDown'
          ? Math.min(currentIndex < 0 ? 0 : currentIndex + 1, actions.length - 1)
          : Math.max(currentIndex < 0 ? actions.length - 1 : currentIndex - 1, 0);
        actions[nextIndex]?.focus();
        event.preventDefault();
        return;
      }
      if (event.key === 'ArrowLeft') {
        const actions = [...document.querySelectorAll(actionSelector)];
        const current = document.activeElement;
        const row = current?.closest('.entry');
        const rowActions = row ? [...row.querySelectorAll(actionSelector)] : [];
        const rowIndex = rowActions.indexOf(current);
        const currentIndex = actions.indexOf(current);
        const hasParent = Boolean(currentPath);
        const handled = rowIndex > 0 || hasParent || currentIndex > 0;
        if (rowIndex > 0) {
          rowActions[rowIndex - 1].focus();
        } else if (hasParent) {
          showFolder(parentPath(currentPath), true);
        } else {
          if (currentIndex > 0) actions[currentIndex - 1].focus();
        }
        if (handled) event.preventDefault();
        return;
      }
      if (event.key === 'ArrowRight') {
        const row = event.target.closest?.('.entry');
        const rowActions = row ? [...row.querySelectorAll(actionSelector)] : [];
        const current = document.activeElement;
        const rowIndex = rowActions.indexOf(current);
        if (current instanceof HTMLButtonElement && current.classList.contains('folder')) {
          current.click();
          event.preventDefault();
        } else if (rowIndex >= 0 && rowIndex < rowActions.length - 1) {
          rowActions[rowIndex + 1].focus();
          event.preventDefault();
        } else {
          const actions = [...document.querySelectorAll(actionSelector)];
          const currentIndex = actions.indexOf(current);
          if (currentIndex >= 0 && currentIndex < actions.length - 1) {
            actions[currentIndex + 1].focus();
            event.preventDefault();
          }
        }
      }
    });

    const initialPath = new URLSearchParams(window.location.search).get('path') || '';
    window.history.replaceState({ path: initialPath }, '', window.location.href);
    showFolder(initialPath, false);
  </script>
</body>
</html>
